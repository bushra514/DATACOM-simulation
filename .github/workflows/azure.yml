name: Azure Login Check

on:
  push:
    branches: [main]

jobs:
  azure-login:
    runs-on: ubuntu-latest

    steps :
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Login to Azure
      uses: azure/login@v1
      with:
          creds: ${{ secrets.AZURE_CREDENTIALS}}

    - name: Show success message
      run: echo "Azure login successful 🎉"
